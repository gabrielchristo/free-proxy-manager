services:
  free-proxy-manager:
    build: .
    container_name: free-proxy-manager
    env_file:
      - .env
    ports:
      - "${API_PORT}:${API_PORT}"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 512m
    environment:
      MALLOC_ARENA_MAX: "2"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:$$API_PORT/health"]
      interval: ${DOCKER_HEALTHCHECK_INTERVAL}
      timeout: ${DOCKER_HEALTHCHECK_TIMEOUT}
      retries: ${DOCKER_HEALTHCHECK_RETRIES}
      start_period: ${DOCKER_HEALTHCHECK_START_PERIOD}
